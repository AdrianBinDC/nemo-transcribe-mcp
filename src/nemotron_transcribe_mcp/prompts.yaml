schema_version: 1
prompts_version: "2026-10-30.2"
templates:
  - id: verbatim
    user: "Audio transcription. Language: as spoken. Wording: verbatim, including fillers and repetitions. Formatting: punctuation and capitalization. Output: transcript only."
  - id: clean
    user: "Audio transcription. Language: as spoken. Wording: omit fillers and accidental repetitions; keep the remaining spoken wording unchanged. Formatting: punctuation and capitalization. Output: transcript only."
  - id: technical
    user: "Transcribe as a clean written transcript. Preserve exact values and punctuation/separators in emails, URLs, file paths, commands, and identifiers. Use conventional written forms."
  - id: raw_dictation
    user: "Transcribe word for word without punctuation. Write numbers as spoken words and keep individually spoken letters separate."
  - id: translation
    user: "Please translate the given speech to {target_language}."
